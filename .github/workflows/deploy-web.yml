name: Deploy Web Dashboard to GitHub Pages

on:
  # 정기 스케줄(8대 시간대)은 cron-job.org -> smart-alert.yml이 정각 단독 담당 (GitHub schedule 지연·새벽 헛돌기 제거)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'generate_web.py'
      - 'src/**'
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # 종가베팅 성과 및 공시 상태 캐시 복원
      - name: Restore state cache
        uses: actions/cache/restore@v6
        with:
          path: state
          key: disclosure-state-${{ github.run_id }}
          restore-keys: disclosure-state-

      - name: Build Web Dashboard
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_web.py

      # 최신 상태 캐시 저장
      - name: Save state cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: state
          key: disclosure-state-${{ github.run_id }}

      # 종가베팅 1개월 기록 영구 저장 (git 커밋)
      - name: Persist track record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "chore: update betting and swing track records [skip ci]"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push origin main && break; sleep 5; done


      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
